<p>我们平时把零散的想法写在卡片上，然后按照思想之间的关联，这些卡片（想法）彼此链接起来。</p>
<p>当处于长期积累时，卡片箱里的想法开始产生新的关联，写作变成了整合自己的碎片认知，而不是临时凭空想象。</p>
<p>核心逻辑：</p>
<ol>
<li>
<p>把每个想法拆成独立卡片（原子化）</p>
</li>
<li>
<p>用链接把卡片连接成网络（结构化）</p>
</li>
<li>
<p>写作/决策时，从网络中调用并组合（重组）</p>
</li>
